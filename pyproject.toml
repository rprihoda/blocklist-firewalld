[project]
name = "blocklist-firewalld"
version = "1.0.0"
description = "Create ipset lists from blocklists managed by firewalld"
readme = "README.md"
requires-python = ">=3.7"
license = {file = "LICENSE"}
authors = [
    {name = "Ryan Prihoda", email = "ryanprihoda@gmail.com"}
]
keywords = ["firewalld", "ipset", "blocklist", "security", "firewall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    # No external Python dependencies required
    # The script uses system commands: firewall-cmd, ipset, curl, sed
]

[project.urls]
Homepage = "https://github.com/rprihoda/blocklist-firewalld"
Repository = "https://github.com/rprihoda/blocklist-firewalld.git"
Issues = "https://github.com/rprihoda/blocklist-firewalld/issues"

[project.scripts]
blocklist-firewalld = "blocklist_firewalld:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Single-file module. blocklist-firewalld.py is a symlink to it so the script
# can still be run (and copied) directly, as the README describes.
py-modules = ["blocklist_firewalld"]

# uv specific configuration
[tool.uv]
dev-dependencies = []

# Optional: Black code formatter configuration
[tool.black]
line-length = 88
target-version = ['py37']

# Optional: isort import sorter configuration
[tool.isort]
profile = "black"
line_length = 88
